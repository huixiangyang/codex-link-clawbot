{{define "directory.cute"}}<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><meta name="viewport" content="width=1080, initial-scale=1"><style>.top-meta,.top-note,.edition,.index,.folio,.footer>span{display:none!important}</style>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:{{.Height}}px;overflow:hidden}body{--cream:#191714;--paper:#24211d;--ink:#f7efe3;--muted:#a99d90;--line:#4d453d;--rose:#d99b9a;--mint:#9fbead;--butter:#d8bc79;background:var(--cream);color:var(--ink);font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}body.day{--cream:#f5eadb;--paper:#fff9ef;--ink:#3d342e;--muted:#82746a;--line:#d9c9ba;--rose:#a95f63;--mint:#527b67;--butter:#9b762c}.page{height:100%;padding:38px 46px 32px;display:flex;flex-direction:column}.top{height:46px;padding:0 6px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--ink)}.brand{font-size:17px;font-weight:850;letter-spacing:.2em}.top-note{color:var(--muted);font-size:13px;font-weight:680;letter-spacing:.08em}.hero{height:156px;padding:27px 6px 20px;display:flex;align-items:flex-end;justify-content:space-between}.hero h1{margin:0;font-size:76px;font-weight:800;line-height:.97;letter-spacing:-.06em}.hero p{width:340px;margin:0 0 5px;color:var(--muted);font-size:21px;font-weight:540;line-height:1.5;text-align:right}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:19px}.fact{min-height:82px;padding:14px 17px;background:var(--paper);border:1px solid var(--line);border-radius:17px}.fact-label{color:var(--muted);font-size:12px;font-weight:760;letter-spacing:.1em}.fact-value{margin-top:8px;font-size:22px;font-weight:690;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sections{min-height:0;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:15px}.section{min-height:0;padding:18px 20px 13px;background:var(--paper);border:1px solid var(--line);border-radius:23px;display:flex;flex-direction:column}.section:nth-child(3n+1){--accent:var(--rose)}.section:nth-child(3n+2){--accent:var(--mint)}.section:nth-child(3n){--accent:var(--butter)}.section-head{height:58px;display:grid;grid-template-columns:45px 1fr 40px;align-items:start;border-bottom:2px solid var(--accent)}.section-code{color:var(--accent);font:800 25px/1 "Noto Sans Mono CJK SC",monospace}.section-title{font-size:25px;font-weight:760;letter-spacing:-.025em}.icon{justify-self:end;color:var(--accent)}.icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.items{padding-top:7px;display:flex;flex:1;flex-direction:column}.item{min-height:48px;display:grid;grid-template-columns:45px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-code{color:var(--accent);font:760 17px/1 "Noto Sans Mono CJK SC",monospace}.item-copy{min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.item-label{font-size:21px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{flex:0 0 auto;padding:3px 7px;border-radius:8px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--muted);font-size:11px;font-weight:720}.footer{height:49px;padding:19px 6px 0;display:flex;justify-content:space-between;color:var(--muted);font-size:15px}.footer strong{color:var(--ink);font-weight:720}
</style></head><body class="{{.Theme}}"><main class="page"><header class="top"><span class="brand">WECLAW</span><span class="top-note">MOBILE COMMAND BOOK</span></header><section class="hero"><h1>{{.Title}}</h1><p>{{.Subtitle}}</p></section><section class="facts">{{range .Facts}}<div class="fact"><div class="fact-label">{{.Label}}</div><div class="fact-value">{{.Value}}</div></div>{{end}}</section><section class="sections">{{range .Sections}}<article class="section"><header class="section-head"><span class="section-code">{{.Code}}</span><span class="section-title">{{.Title}}</span><span class="icon">{{lucide .Icon}}</span></header><div class="items">{{range .Items}}<div class="item"><span class="item-code">{{.Code}}</span><div class="item-copy"><span class="item-label">{{.Label}}</span>{{if .Meta}}<span class="item-meta">{{.Meta}}</span>{{end}}</div></div>{{end}}</div></article>{{end}}</section><footer class="footer"><strong>{{.Footer}}</strong><span>发送 / 随时刷新</span></footer></main></body></html>{{end}}

{{define "directory.noir"}}<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><meta name="viewport" content="width=1080, initial-scale=1"><style>.top-meta,.top-note,.edition,.index,.folio,.footer>span{display:none!important}</style>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:{{.Height}}px;overflow:hidden}body{--bg:#060606;--ink:#f5f2e9;--muted:#8d8a82;--line:#35332e;--gold:#c6ad75;--panel:#0d0d0d;background:var(--bg);color:var(--ink);font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}body.day{--bg:#f1efe9;--ink:#0e0e0d;--muted:#696761;--line:#c6c1b5;--gold:#806a3d;--panel:#f9f7f2}.page{height:100%;padding:39px 50px 32px;display:flex;flex-direction:column}.top{height:44px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--gold)}.mark{font-size:16px;font-weight:820;letter-spacing:.25em}.folio{color:var(--gold);font:690 14px/1 "Noto Sans Mono CJK SC",monospace;letter-spacing:.08em}.hero{height:160px;padding:27px 0 21px;display:flex;align-items:flex-end;justify-content:space-between}.hero h1{margin:0;font-size:80px;font-weight:760;line-height:.95;letter-spacing:-.06em}.hero p{width:350px;margin:0 0 6px;color:var(--muted);font-size:21px;line-height:1.5;text-align:right}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--gold);border:1px solid var(--gold);margin-bottom:20px}.fact{min-height:84px;padding:14px 17px;background:var(--bg)}.fact-label{color:var(--gold);font-size:11px;font-weight:760;letter-spacing:.16em}.fact-value{margin-top:9px;font-size:22px;font-weight:630;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sections{min-height:0;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:17px}.section{min-height:0;padding:19px 20px 14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}.section-head{height:58px;display:grid;grid-template-columns:46px 1fr 38px;align-items:start;border-bottom:1px solid var(--gold)}.section-code{color:var(--gold);font:760 25px/1 "Noto Sans Mono CJK SC",monospace}.section-title{font-size:25px;font-weight:680;letter-spacing:-.02em}.icon{justify-self:end;color:var(--gold)}.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.items{padding-top:7px;display:flex;flex:1;flex-direction:column}.item{min-height:48px;display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-code{color:var(--gold);font:690 17px/1 "Noto Sans Mono CJK SC",monospace}.item-copy{min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.item-label{font-size:21px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{flex:0 0 auto;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.02em}.footer{height:48px;padding-top:19px;display:flex;justify-content:space-between;color:var(--muted);font-size:14px;letter-spacing:.02em}.footer strong{color:var(--gold);font-weight:700}
</style></head><body class="{{.Theme}}"><main class="page"><header class="top"><span class="mark">WECLAW</span><span class="folio">DIRECTORY 01 / 06</span></header><section class="hero"><h1>{{.Title}}</h1><p>{{.Subtitle}}</p></section><section class="facts">{{range .Facts}}<div class="fact"><div class="fact-label">{{.Label}}</div><div class="fact-value">{{.Value}}</div></div>{{end}}</section><section class="sections">{{range .Sections}}<article class="section"><header class="section-head"><span class="section-code">{{.Code}}</span><span class="section-title">{{.Title}}</span><span class="icon">{{lucide .Icon}}</span></header><div class="items">{{range .Items}}<div class="item"><span class="item-code">{{.Code}}</span><div class="item-copy"><span class="item-label">{{.Label}}</span>{{if .Meta}}<span class="item-meta">{{.Meta}}</span>{{end}}</div></div>{{end}}</div></article>{{end}}</section><footer class="footer"><strong>{{.Footer}}</strong><span>发送 / 刷新目录</span></footer></main></body></html>{{end}}

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check documentation links
        run: ./scripts/check-doc-links.sh

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test ./... -count=1 -race

      - name: Build packages
        run: go build ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/config
            target: FuzzDecodeConfig
          - package: ./internal/ilink
            target: FuzzDecodeGetUpdatesResponse
          - package: ./internal/messaging
            target: FuzzValidateInboundFile
          - package: ./internal/messaging
            target: FuzzValidatedImageExtension
          - package: ./internal/codex
            target: FuzzCodexEventDecoders
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run fuzz smoke test
        run: go test "${{ matrix.package }}" -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=10s

  build:
    needs: [quality, fuzz-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Determine immutable development version
        id: version
        shell: bash
        run: echo "version=v1.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Linux binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/huixiangyang/weclaw/internal/cli.Version=${{ steps.version.outputs.version }}" \
            -o weclaw_linux_${GOARCH} ./cmd/weclaw

      - uses: actions/upload-artifact@v4
        with:
          name: weclaw_linux_${{ matrix.goarch }}
          path: weclaw_linux_${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

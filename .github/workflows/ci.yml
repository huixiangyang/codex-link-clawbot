name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run shared development checks
        run: make check

  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/app/config
            target: FuzzDecodeConfig
          - package: ./internal/adapters/wechat/ilink
            target: FuzzDecodeGetUpdatesResponse
          - package: ./internal/adapters/wechat
            target: FuzzValidateInboundFile
          - package: ./internal/adapters/wechat
            target: FuzzValidatedImageExtension
          - package: ./internal/adapters/appserver
            target: FuzzCodexEventDecoders
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run fuzz smoke test
        run: go test "${{ matrix.package }}" -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=10s

  build:
    needs: [quality, fuzz-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Determine immutable development version
        id: version
        shell: bash
        run: echo "version=v1.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Linux binary
        env:
          CGO_ENABLED: 0
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/huixiangyang/codex-link-clawbot/internal/cli.Version=${{ steps.version.outputs.version }}" \
            -o codex-link-clawbot ./cmd/codex-link-clawbot

      - uses: actions/upload-artifact@v4
        with:
          name: codex-link-clawbot
          path: codex-link-clawbot
          if-no-files-found: error
          retention-days: 7
